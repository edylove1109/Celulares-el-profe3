name: Build APK V22 Fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk-v22-fix.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and extract V22 source
        shell: bash
        run: |
          ZIP="./Celulares_El_Profe_V22_DOS_ADMINISTRADORES_ACTIVIDAD_Y_PERMISOS_CORREGIDO.zip"
          test -f "$ZIP" || { echo "No se encontró $ZIP"; exit 1; }
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q "$ZIP" -d buildsrc
          ROOT=$(find buildsrc -type f -name settings.gradle -o -name settings.gradle.kts | head -n1 | xargs -r dirname)
          test -n "$ROOT" || { echo "No se encontró proyecto Gradle"; find buildsrc -maxdepth 3 -type f | head -50; exit 1; }
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Proyecto: $ROOT"

      - name: Fix FirebaseAuthException code property
        shell: bash
        run: |
          FILE=$(find "$PROJECT_ROOT/app/src/main/java" -name MainActivity.kt -print -quit)
          test -n "$FILE" || { echo "No se encontró MainActivity.kt"; exit 1; }
          echo "Archivo: $FILE"
          echo '--- ANTES ---'
          nl -ba "$FILE" | sed -n '300,320p'
          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          lines = p.read_text(encoding='utf-8').splitlines()
          for i in range(min(299, len(lines)), min(320, len(lines))):
              lines[i] = lines[i].replace('.code', '.errorCode')
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          echo '--- DESPUÉS ---'
          nl -ba "$FILE" | sed -n '300,320p'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Celulares-El-Profe-V22-FINAL
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
