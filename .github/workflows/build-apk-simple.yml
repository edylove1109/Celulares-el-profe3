name: Build APK Simple
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: unzip -q Celulares_El_Profe_V22_DOS_ADMINISTRADORES_FINAL_2_ADMINS_CUENTAS_ACTIVIDAD.zip -d /tmp/cep && cp -a /tmp/cep/. .
      - run: sed -i 's/error\.code/error.message/g' app/src/main/java/com/celulareselprofe/app/MainActivity.kt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Celulares-El-Profe-APK
          path: app/build/outputs/apk/debug/app-debug.apk
