name: Construir APK V22

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extraer V22
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname 'Celulares_El_Profe_V22*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró el ZIP V22."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"

          rm -rf CelularesElProfeAndroid
          mkdir -p CelularesElProfeAndroid

          unzip -q "$ZIP_FILE" -d CelularesElProfeAndroid

          ROOT=$(find CelularesElProfeAndroid \
            -type f \
            -name settings.gradle.kts \
            -print -quit | xargs -r dirname)

          if [ -z "$ROOT" ]; then
            echo "ERROR: No se encontró el proyecto Android."
            exit 1
          fi

          echo "Proyecto encontrado: $ROOT"
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Construir APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Celulares-El-Profe-V22
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
