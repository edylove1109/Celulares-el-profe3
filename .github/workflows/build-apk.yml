name: Construir APK V22

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Localizar proyecto Android
        shell: bash
        run: |
          set -e
          echo "=== Contenido del repositorio ==="
          ls -lah
          if [ -f "settings.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
            echo "Proyecto Android encontrado en la raíz."
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi
          ZIP_FILE="./Celulares_El_Profe_V22_DOS_ADMINISTRADORES_ACTIVIDAD_Y_PERMISOS_CORREGIDO.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró el paquete V22 corregido de 2 administradores."
            exit 1
          fi
          echo "ZIP seleccionado: $ZIP_FILE"
          rm -rf CelularesElProfeAndroid
          mkdir -p CelularesElProfeAndroid
          unzip -q "$ZIP_FILE" -d CelularesElProfeAndroid
          ROOT=$(find CelularesElProfeAndroid -type f -name settings.gradle.kts -print -quit | xargs -r dirname)
          if [ -z "$ROOT" ]; then
            echo "ERROR: El ZIP no contiene settings.gradle.kts"
            exit 1
          fi
          echo "Proyecto encontrado en: $ROOT"
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verificar proyecto
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          echo "Proyecto Android correcto."

      - name: Diagnosticar MainActivity antes de compilar
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          FILE=$(find app/src/main/java -name MainActivity.kt -print -quit)
          if [ -z "$FILE" ]; then
            echo "ERROR: MainActivity.kt no encontrado"
            exit 1
          fi
          echo "=== MainActivity.kt: líneas 300-320 ==="
          nl -ba "$FILE" | sed -n '300,320p'
          echo "=== Referencias .code en MainActivity.kt ==="
          grep -n '\.code' "$FILE" || true

      - name: Generar APK V22
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          echo "=== Generando APK V22 ==="
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Celulares-El-Profe-APK-V22
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
