name: Generar APK V23

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar proyecto
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Contenido de la raíz ==="
          ls -la

          if [ -f "settings.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
            echo "Proyecto encontrado en la raíz"
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1 || true)
            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No hay proyecto Android ni ZIP en la raíz"
              ls -la
              exit 1
            fi
            echo "Usando ZIP: $ZIP_FILE"
            rm -rf CelularesElProfeAndroid
            mkdir -p CelularesElProfeAndroid
            unzip -q "$ZIP_FILE" -d CelularesElProfeAndroid
            ROOT=$(find CelularesElProfeAndroid -name "settings.gradle.kts" -type f | head -n 1 | xargs dirname)
            if [ -z "$ROOT" ]; then
              echo "ERROR: No se encontró settings.gradle.kts dentro del ZIP"
              find CelularesElProfeAndroid -type f | head -30
              exit 1
            fi
            echo "Proyecto en: $ROOT"
            echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          fi

      - name: Verificar proyecto
        shell: bash
        run: |
          set -euo pipefail
          echo "PROJECT_DIR=$PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/java/com/celulareselprofe/app/MainActivity.kt"
          echo "=== Versión ==="
          grep -n "versionCode\|versionName" "$PROJECT_DIR/app/build.gradle.kts"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Aceptar licencias Android
        run: |
          yes | sdkmanager --licenses || true

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Celulares-El-Profe-APK-V23
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
