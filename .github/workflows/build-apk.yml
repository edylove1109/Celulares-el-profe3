name: Construir APK V22

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar base V22 estable
        shell: bash
        run: |
          set -e
          ZIP_FILE="./Celulares_El_Profe_V22_DOS_ADMINISTRADORES_ADMIN_CUENTA_CORREGIDO.zip"
          test -f "$ZIP_FILE"
          rm -rf CelularesElProfeAndroid
          mkdir -p CelularesElProfeAndroid
          unzip -q "$ZIP_FILE" -d CelularesElProfeAndroid
          ROOT=$(find CelularesElProfeAndroid -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs -r dirname)
          test -n "$ROOT"
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          echo "Base seleccionada: $ROOT"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verificar proyecto
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          test -f settings.gradle.kts -o -f settings.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          echo "Proyecto Android válido."

      - name: Generar APK V22 desde cero
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Subir APK V22
        uses: actions/upload-artifact@v4
        with:
          name: Celulares-El-Profe-APK-V22
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
