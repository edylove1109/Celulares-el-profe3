name: Admin Build Patch
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Extract source
        run: unzip -q Celulares_El_Profe_V22_DOS_ADMINISTRADORES_FINAL_2_ADMINS_CUENTAS_ACTIVIDAD.zip -d /tmp/cep && cp -a /tmp/cep/. .
      - name: Patch
        run: python3 -c "from pathlib import Path; p=Path('app/src/main/java/com/celulareselprofe/app/MainActivity.kt'); s=p.read_text(); s=s.replace('error.code','error.message'); p.write_text(s)"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Verify
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Celulares-El-Profe-APK-Admin-Principal
          path: app/build/outputs/apk/debug/app-debug.apk
