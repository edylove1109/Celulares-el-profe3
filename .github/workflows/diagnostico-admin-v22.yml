name: Diagnostico Admin V22
on:
  push:
    paths:
      - '.github/workflows/diagnostico-admin-v22.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer fuente V22
        run: |
          set -eux
          rm -rf /tmp/src
          unzip -q Celulares_El_Profe_V22_DOS_ADMINISTRADORES_ADMIN_CUENTA_CORREGIDO.zip -d /tmp/src
      - name: Empaquetar diagnóstico
        run: |
          set +e
          mkdir -p /tmp/report
          find /tmp/src -type f \( -name '*.html' -o -name '*.js' -o -name '*.kt' -o -name '*.xml' \) -print > /tmp/report/archivos.txt
          grep -RniE 'loadAllClientAccounts|loadMyClientAccount|createClientAccount|loadActivity|isAdmin|nativeAdmin|clientAccounts|appActivity|Role|role|admin|cuenta|actividad' /tmp/src --include='*.html' --include='*.js' --include='*.kt' --include='*.xml' > /tmp/report/coincidencias.txt || true
          find /tmp/src -type f \( -name 'index.html' -o -name '*.js' \) -print0 | while IFS= read -r -d '' f; do echo "===== $f ====="; nl -ba "$f"; done > /tmp/report/web_code.txt
          find /tmp/src -type f -name 'MainActivity.kt' -exec cp {} /tmp/report/MainActivity.kt \; || true
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostico-admin-v22-web
          path: /tmp/report
