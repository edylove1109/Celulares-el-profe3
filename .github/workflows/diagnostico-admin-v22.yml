name: Diagnostico Admin V22
on:
  push:
    paths:
      - '.github/workflows/diagnostico-admin-v22.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer fuente V22
        run: |
          set -eux
          rm -rf /tmp/src
          unzip -q Celulares_El_Profe_V22_DOS_ADMINISTRADORES_ADMIN_CUENTA_CORREGIDO.zip -d /tmp/src
      - name: Inspeccionar reglas y permisos
        run: |
          set +e
          mkdir -p /tmp/report
          find /tmp/src -type f -print > /tmp/report/all_files.txt
          grep -RniE 'clientAccounts|appActivity|users|role|Role|admin|ADMIN|isAdmin|customerUid|customerEmail' /tmp/src --exclude-dir=.gradle --exclude='*.png' --exclude='*.jpg' --exclude='*.mp4' --exclude='*.apk' > /tmp/report/all_matches.txt || true
          find /tmp/src -type f \( -name '*.rules' -o -name 'firestore.rules' -o -name 'storage.rules' \) -print -exec sh -c 'echo "===== $1 ====="; nl -ba "$1"' _ {} \; > /tmp/report/rules.txt
          find /tmp/src -type f \( -name 'index.html' -o -name '*.js' -o -name '*.kt' -o -name '*.rules' \) -print0 | while IFS= read -r -d '' f; do echo "===== $f ====="; nl -ba "$f"; done > /tmp/report/source_code.txt
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostico-admin-v22-rules
          path: /tmp/report
