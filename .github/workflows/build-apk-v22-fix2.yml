name: Build APK V22 Fix 2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate and extract V22 source
        shell: bash
        run: |
          set -e
          ZIP="./Celulares_El_Profe_V22_DOS_ADMINISTRADORES_ACTIVIDAD_Y_PERMISOS_CORREGIDO.zip"
          test -f "$ZIP"
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q "$ZIP" -d buildsrc
          ROOT=$(find buildsrc -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)
          test -n "$ROOT"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Fix exception references
        shell: bash
        run: |
          set -e
          FILE=$(find "$PROJECT_ROOT/app/src/main/java" -name MainActivity.kt -print -quit)
          test -n "$FILE"
          python3 - "$FILE" <<'PY'
import sys
from pathlib import Path
p = Path(sys.argv[1])
s = p.read_text(encoding='utf-8')
s = s.replace('error.errorCode', 'error.message ?: "Error"')
s = s.replace('error.code', 'error.message ?: "Error"')
p.write_text(s, encoding='utf-8')
PY
          echo "=== MainActivity referencias inválidas ==="
          grep -nE 'error\.(code|errorCode)' "$FILE" || true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        working-directory: buildsrc
        run: gradle :app:assembleRelease --stacktrace --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Celulares-El-Profe-V22-FINAL
          path: buildsrc/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
