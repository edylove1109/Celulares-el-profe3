name: Build APK - Admin Principal
on:
  push:
    branches: [fix-admin-principal-juancarlos]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Locate and extract V22 source
        run: |
          set -e
          ZIP="Celulares_El_Profe_V22_DOS_ADMINISTRADORES_FINAL_2_ADMINS_CUENTAS_ACTIVIDAD.zip"
          test -f "$ZIP"
          mkdir -p /tmp/cep
          unzip -q "$ZIP" -d /tmp/cep
          test -f /tmp/cep/gradlew
          cp -a /tmp/cep/. .
          chmod +x ./gradlew

      - name: Set primary admin email in Android code and Firestore rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          email = 'juancarlospelayolepe7@gmail.com'
          p = Path('app/src/main/java/com/celulareselprofe/app/MainActivity.kt')
          s = p.read_text()
          s = s.replace('val isAdmin = roleLower == "admin" || roleUpper == "admin"', 'val isAdmin = roleLower == "admin" || roleUpper == "admin" || user.email?.equals("juancarlospelayolepe7@gmail.com", ignoreCase = true) == true')
          s = s.replace('adminRole = role1.equals("admin", ignoreCase = true) || role2.equals("admin", ignoreCase = true)', 'adminRole = role1.equals("admin", ignoreCase = true) || role2.equals("admin", ignoreCase = true) || email.equals("juancarlospelayolepe7@gmail.com", ignoreCase = true)')
          p.write_text(s)

          r = Path('firestore/firestore.rules')
          rs = r.read_text()
          old = """function isAdmin() {\n      return signedIn() &&\n        (get(/databases/$(database)/documents/users/$(request.auth.uid)).data.role in ['admin', 'Admin', 'ADMIN'] ||\n         get(/databases/$(database)/documents/users/$(request.auth.uid)).data.Role in ['admin', 'Admin', 'ADMIN']);\n    }"""
          new = """function isAdmin() {\n      return signedIn() &&\n        (request.auth.token.email == 'juancarlospelayolepe7@gmail.com' ||\n         get(/databases/$(database)/documents/users/$(request.auth.uid)).data.role in ['admin', 'Admin', 'ADMIN'] ||\n         get(/databases/$(database)/documents/users/$(request.auth.uid)).data.Role in ['admin', 'Admin', 'ADMIN']);\n    }"""
          if old not in rs:
              raise SystemExit('No se encontró la función isAdmin esperada en Firestore rules')
          r.write_text(rs.replace(old, new))
          PY

      - name: Build installable debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Celulares-El-Profe-APK-Admin-Principal
          path: app/build/outputs/apk/debug/*.apk
