name: Diagnostico V22 admin
on:
  push:
    paths:
      - '.github/workflows/diagnostico-v22-admin.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer fuente V22 y diagnosticar
        shell: bash
        run: |
          set -e
          ZIP='Celulares_El_Profe_V22_DOS_ADMINISTRADORES_ADMIN_CUENTA_CORREGIDO.zip'
          mkdir -p /tmp/src
          unzip -q "$ZIP" -d /tmp/src
          ROOT=$(find /tmp/src -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs dirname)
          echo "ROOT=$ROOT"
          find "$ROOT/app/src/main" -type f \( -name '*.kt' -o -name '*.java' -o -name '*.xml' \) | sort > /tmp/files.txt
          echo '=== FILES ==='
          cat /tmp/files.txt
          echo '=== ROLE/ADMIN/CUENTA/ACTIVIDAD MATCHES ==='
          grep -RniE 'Role|role|admin|ADMIN|cuenta|Cuenta|deuda|Deuda|abono|Abono|actividad|Actividad|users/' "$ROOT/app/src/main" > /tmp/matches.txt || true
          cat /tmp/matches.txt
          echo '=== MAIN ACTIVITY CONTEXT ==='
          find "$ROOT/app/src/main" -name 'MainActivity.kt' -print -exec sh -c 'nl -ba "$1" | sed -n "1,900p"' _ {} \; > /tmp/main.txt
          cat /tmp/main.txt
      - name: Subir diagnostico
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-v22-admin
          path: |
            /tmp/files.txt
            /tmp/matches.txt
            /tmp/main.txt
